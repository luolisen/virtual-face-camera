plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.0'
}

def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file("local.properties")
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningProperties.load(releaseSigningPropertiesFile.newDataInputStream())
}
def releaseSigningKeys = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
def hasFormalReleaseSigning = releaseSigningKeys.every { key ->
    def value = releaseSigningProperties.getProperty(key)
    value != null && !value.trim().isEmpty()
}

android {
    namespace 'io.github.alanlaw.vfc'
    compileSdk 36
    ndkVersion '25.1.8937393'

    // BUILD_TIME is diagnostic metadata only; the public app version is fixed below.
    def date = new Date()
    def buildTime = date.format('yyyy-MM-dd HH:mm:ss')

    signingConfigs {
        release {
            if (hasFormalReleaseSigning) {
                storeFile file(releaseSigningProperties.getProperty("storeFile"))
                storePassword releaseSigningProperties.getProperty("storePassword")
                keyAlias releaseSigningProperties.getProperty("keyAlias")
                keyPassword releaseSigningProperties.getProperty("keyPassword")
            }
        }
    }

    defaultConfig {
        applicationId "io.github.alanlaw.vfc"
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName "0.2.3"

        // Inject build time into BuildConfig
        buildConfigField "String", "BUILD_TIME", "\"${buildTime}\""

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fno-exceptions -fno-rtti"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildFeatures {
        buildConfig = true
        compose true
    }

    // Compose compiler is now managed by org.jetbrains.kotlin.plugin.compose

    packaging {
        resources {
            merges += ['META-INF/xposed/*']
        }
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk false
        }
    }
}

// Keep debug builds usable without a local secret, but make every release task
// fail closed when the formal signing material is missing or unreadable.
def verifyReleaseSigning = tasks.register("verifyReleaseSigning") {
    doLast {
        def properties = new Properties()
        def propertiesFile = rootProject.file("local.properties")
        if (propertiesFile.exists()) {
            properties.load(propertiesFile.newDataInputStream())
        }
        def missing = releaseSigningKeys.findAll { key ->
            def value = properties.getProperty(key)
            value == null || value.trim().isEmpty()
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Formal release signing is required; missing local.properties keys: " + missing)
        }
        def keystore = file(properties.getProperty("storeFile"))
        if (!keystore.isFile()) {
            throw new GradleException("Formal release keystore does not exist: " + keystore.absolutePath)
        }
    }
}

tasks.configureEach { task ->
    if (task.name == "preReleaseBuild" || task.name == "validateSigningRelease") {
        task.dependsOn(verifyReleaseSigning)
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:101.0.0'
    implementation 'io.github.libxposed:service:101.0.0'

    // Core Dependencies
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1'
    implementation 'androidx.activity:activity-compose:1.7.0'
    implementation 'androidx.navigation:navigation-compose:2.7.5'

    // Compose Dependencies
    implementation platform('androidx.compose:compose-bom:2023.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation 'org.mockito:mockito-inline:4.11.0'
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2023.08.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Coil for image loading and video thumbnails
    implementation 'io.coil-kt:coil-compose:2.5.0'
    implementation 'io.coil-kt:coil-video:2.5.0'

    // Preference
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // ExoPlayer (Media3) - network stream playback
    implementation "androidx.media3:media3-exoplayer:1.6.0"
    implementation "androidx.media3:media3-exoplayer-rtsp:1.6.0"
    implementation "androidx.media3:media3-exoplayer-hls:1.6.0"
    implementation "androidx.media3:media3-exoplayer-dash:1.6.0"
    implementation "androidx.media3:media3-datasource:1.6.0"
    // RTMP: media3-exoplayer-rtmp requires native libs and may not be available
    // on all mirrors. RTMP is handled via reflection in ExoPlayerBackend with
    // graceful fallback to ProgressiveMediaSource.
}
